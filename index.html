/* =========================================================
   TIMED SCRIPTS + REHEARSAL
   ========================================================= */
const PHASE_CLASS = { open:"k-open", agenda:"k-open", p1:"k-p1", bg:"k-bg", p2:"k-p2", ctx:"k-ctx", m1:"k-m1", m2:"k-m2", wrap:"k-open" };
const clockIn = s => fmt(s);                 // elapsed
const clockLeft = s => fmt(ENC_S - s);       // remaining, as the exam clock shows
const WPS = 2.5;                             // speaking rate, words per second (150 wpm)
let reh = null;

function scriptFor(c){
  if (SCRIPTS[c.id]) return SCRIPTS[c.id];
  const s = c.scheme || {};
  const cover = list => (list || []).map(x => "(Cover: " + x + ")");
  const areas = a => (a?.areas || []).map(x => "(Cover: " + x[0] + ")");
  return [
    ["Hi, I'm Dr. ___, and I'll be your new family doctor. What brings you in today?","(Let them talk 30 to 60 seconds without interrupting.)"],
    ["Before we go further, is there anything else you were hoping to cover today?","Since we're just meeting, tell me a bit about yourself: who's at home, and what do you do?"],
    ["Tell me more about that. When did it start, and how has it changed?"].concat(areas(s.issue1), (c.redFlags||[]).map(f => "(Red flag: " + f.item + ")")),
    ["How is this affecting your day-to-day life?","What do you think might be going on?","What worries you most?","What were you hoping we could do today?"],
    ["Any other medical conditions, operations or hospital stays?","What medications do you take, including over the counter? Any allergies?","Do you smoke, drink alcohol, or use any other substances?","Anything that runs in the family?"],
    ["(If it hasn't come up:) You mentioned ___. Tell me more about that.","Is there anything else that's been on your mind?"].concat(areas(s.issue2)),
    ["How has this been for you?","What do you think is causing it?","What would help most?"],
    s.context?.example ? [s.context.example] : ["(Reflect back how their life situation ties the two problems together.)"],
    cover(s.mgmt1).concat(["How does that plan sound to you?"]),
    cover(s.mgmt2).concat(["What would make that hard to do?"]),
    ["So, to sum up: ___. Does that sound right?","Come back sooner if ___.","What questions do you have? Did I miss anything?"]
  ];
}

function phaseTitle(c, i, spoil){
  const ph = SCRIPT_PHASES[i];
  if (!spoil) return ph.label;
  return ph.label.replace("Problem 1", "Problem 1 (" + c.issue1 + ")").replace("Problem 2", "Problem 2 (" + c.issue2 + ")")
    .replace("Plan for problem 1", "Plan: " + c.issue1).replace("Plan for problem 2", "Plan: " + c.issue2);
}
const talkSecs = lines => Math.round(lines.filter(l => !l.startsWith("(")).join(" ").split(/\s+/).filter(Boolean).length / WPS);

function timelineHTML(activeIdx){
  return `<div class="tline" aria-hidden="true">
    ${SCRIPT_PHASES.map((p,i) => `<span class="seg ${PHASE_CLASS[p.k]} ${i === activeIdx ? "on" : ""}" style="flex:${p.e - p.t}" title="${esc(p.label)}"></span>`).join("")}
    <span class="mark" style="left:${300/ENC_S*100}%"><b>10 left</b></span>
    <span class="mark" style="left:${480/ENC_S*100}%"><b>7 left</b></span>
    <span class="mark" style="left:${720/ENC_S*100}%"><b>3 left</b></span>
  </div>`;
}

function scriptHTML(c, spoil){
  const sc = scriptFor(c);
  const total = sc.reduce((a, l) => a + talkSecs(l), 0);
  return `
    <p class="muted">Your own talking adds up to about ${fmt(total)}; the rest of the 15 minutes is the patient answering. Lines in italics are directions, not words to say. Times show elapsed and, in brackets, what the exam clock would read.</p>
    ${timelineHTML(-1)}
    <ol class="script">
      ${SCRIPT_PHASES.map((p,i) => `
        <li class="ph ${PHASE_CLASS[p.k]}">
          <div class="ph-hd"><span class="ph-t">${clockIn(p.t)}–${clockIn(p.e)} <span class="muted">(${clockLeft(p.t)} left)</span></span><span class="ph-n">${esc(phaseTitle(c, i, spoil))}</span><span class="ph-s muted">~${talkSecs(sc[i])} s of talk</span></div>
          <ul>${sc[i].map(l => l.startsWith("(") ? `<li class="dir">${esc(l)}</li>` : `<li>${esc(l)}</li>`).join("")}</ul>
        </li>`).join("")}
    </ol>
    <div class="notice"><strong>Checkpoints.</strong> Problem 2 should be on the table by 10:00 left, and you should be starting management by 7:00 left. In the last 3 minutes the patient only answers direct questions, so finish exploring before then.</div>`;
}

/* ---------- Rehearsal mode ---------- */
function rehElapsed(){ return reh ? reh.accum + (reh.running ? (Date.now() - reh.start)/1000 : 0) : 0; }
function stopRehearse(){ if (reh) { clearInterval(reh.tick); reh = null; } }

function showRehearse(id, back){
  stopRehearse();
  screen("rehearse");
  const c = caseById(id);
  const spoil = c.kind !== "official" || !!back;
  reh = { c, back, running:false, start:0, accum:0, idx:0, splits:[], tick:null, done:false, spoil };
  view.innerHTML = `
    <button class="back">Back</button>
    <h1>Rehearse: ${esc(c.name)}, ${c.age}${c.sex}</h1>
    <p class="lede">Say each line out loud and leave a few seconds for the patient's answer. Tap <strong>Next phase</strong> as you move on; the timer tells you whether you're ahead of or behind pace.</p>
    <div class="clocks"><div class="clock segment"><span class="lab">Assessment time</span><span class="t" id="rClock">15:00</span></div></div>
    <div id="rPace" class="pace-now" aria-live="polite"></div>
    <div id="rTl"></div>
    <div id="rCur" class="card"></div>
    <div class="bar">
      <button class="btn primary" id="rGo">Start</button>
      <button class="btn" id="rNext" disabled>Next phase</button>
      <button class="btn" id="rReset">Reset</button>
    </div>
    <div id="rSplits"></div>`;
  view.querySelector(".back").onclick = () => { stopRehearse(); back ? back() : showReview(id); };
  view.querySelector("#rGo").onclick = () => {
    if (reh.done) return;
    if (reh.running) { reh.accum = rehElapsed(); reh.running = false; }
    else { reh.start = Date.now(); reh.running = true; }
    renderReh();
  };
  view.querySelector("#rNext").onclick = () => {
    if (!reh.running || reh.done) return;
    reh.splits.push(rehElapsed());
    reh.idx++;
    if (reh.idx >= SCRIPT_PHASES.length) finishReh(); else renderReh();
  };
  view.querySelector("#rReset").onclick = () => showRehearse(id, back);
  reh.tick = setInterval(tickReh, 250);
  renderReh();
  window.scrollTo(0,0);
}

function paceText(delta){
  const d = Math.round(delta);
  if (Math.abs(d) <= 10) return `<span class="ok">on pace</span>`;
  return d > 0 ? `<span class="late">${fmt(d)} behind</span>` : `<span class="ok">${fmt(-d)} ahead</span>`;
}

function renderReh(){
  if (!reh) return;
  const c = reh.c, i = Math.min(reh.idx, SCRIPT_PHASES.length - 1), p = SCRIPT_PHASES[i], sc = scriptFor(c);
  const go = document.getElementById("rGo"), nx = document.getElementById("rNext");
  if (go) go.textContent = reh.done ? "Done" : reh.running ? "Pause" : (reh.accum ? "Resume" : "Start");
  if (go) go.disabled = reh.done;
  if (nx) { nx.disabled = !reh.running || reh.done; nx.textContent = i === SCRIPT_PHASES.length - 1 ? "Finish" : "Next phase"; nx.hidden = reh.done; }
  if (go) go.hidden = reh.done;
  const rs = document.getElementById("rReset"); if (rs) rs.textContent = reh.done ? "Run it again" : "Reset";
  document.getElementById("rTl").innerHTML = timelineHTML(reh.done ? -1 : i);
  if (!reh.done) {
    const nextP = SCRIPT_PHASES[i+1];
    document.getElementById("rCur").innerHTML = `
      <div class="ph-hd"><span class="ph-t">Target ${clockIn(p.t)}–${clockIn(p.e)} <span class="muted">(${clockLeft(p.t)} to ${clockLeft(p.e)} left)</span></span></div>
      <h2 style="margin:4px 0 8px">${esc(phaseTitle(c, i, reh.spoil))}</h2>
      <ul class="script-cur">${sc[i].map(l => l.startsWith("(") ? `<li class="dir">${esc(l)}</li>` : `<li>${esc(l)}</li>`).join("")}</ul>
      ${nextP ? `<p class="muted" style="margin-bottom:0">Next at ${clockLeft(nextP.t)} left: ${esc(phaseTitle(c, i+1, reh.spoil))}</p>` : ""}`;
  }
  document.getElementById("rSplits").innerHTML = reh.splits.length ? `
    <h2>Your splits</h2>
    <table class="splits"><thead><tr><th>Phase</th><th>Target end</th><th>You</th><th>Pace</th></tr></thead><tbody>
      ${reh.splits.map((s,k) => `<tr><td>${esc(SCRIPT_PHASES[k].label)}</td><td>${clockIn(SCRIPT_PHASES[k].e)}</td><td>${clockIn(s)}</td><td>${paceText(s - SCRIPT_PHASES[k].e)}</td></tr>`).join("")}
    </tbody></table>` : "";
  tickReh();
}

function tickReh(){
  if (!reh) return;
  const el = rehElapsed(), left = ENC_S - el;
  const ck = document.getElementById("rClock"), pc = document.getElementById("rPace");
  if (ck) ck.textContent = left >= 0 ? fmt(left) : "−" + fmt(-left);
  if (!pc || reh.done) return;
  const p = SCRIPT_PHASES[reh.idx];
  if (!reh.running && !reh.accum) { pc.innerHTML = `Tap Start when you begin speaking.`; return; }
  const over = el - p.e;
  const msgs = [];
  if (over > 0) msgs.push(`<span class="late">${fmt(over)} over this phase. Move on.</span>`);
  else msgs.push(`${fmt(-over)} left in this phase`);
  const shouldBe = SCRIPT_PHASES.findIndex(q => el >= q.t && el < q.e);
  if (shouldBe > reh.idx + 0) msgs.push(`<span class="late">You should be on: ${esc(SCRIPT_PHASES[shouldBe].label)}</span>`);
  if (el >= 300 && el < 312 && reh.idx < 5) msgs.push(`<span class="late">10 minutes left: an examiner would prompt problem 2 now.</span>`);
  if (el >= 480 && el < 492 && reh.idx < 8) msgs.push(`<span class="late">7 minutes left: you should be into management.</span>`);
  if (left <= 0) msgs.push(`<span class="late">Time's up.</span>`);
  pc.innerHTML = msgs.join(" · ");
}

function finishReh(){
  reh.accum = rehElapsed(); reh.running = false; reh.done = true;
  const end = reh.accum;
  renderReh();
  const behind = reh.splits.map((s,k) => s - SCRIPT_PHASES[k].e);
  const worst = behind.reduce((w, d, k) => d > w.d ? {d, k} : w, {d:-Infinity, k:-1});
  document.getElementById("rPace").innerHTML = end <= ENC_S
    ? `<span class="ok">Finished in ${fmt(end)}, with ${fmt(ENC_S - end)} to spare.</span>`
    : `<span class="late">Finished at ${fmt(end)}: ${fmt(end - ENC_S)} over the 15 minutes.</span>`;
  document.getElementById("rCur").innerHTML = `
    <h2 style="margin-top:0">How the timing went</h2>
    <p>${worst.d > 20 ? `You lost the most time by the end of <strong>${esc(SCRIPT_PHASES[worst.k].label.toLowerCase())}</strong> (${fmt(worst.d)} behind). Trim the questions there, or move the background sweep into problem 1.` : `You kept close to pace throughout.`}</p>
    <p class="muted">The real exam runs at the patient's pace, so aim to finish the rehearsal with about a minute to spare.</p>`;
}

/* ---------- Live pace guide in the mock ---------- */
function livePaceHTML(){ return prefs.paceGuide === false ? "" : `<div class="pace-now" id="livePace" aria-live="off"></div>`; }
function tickLivePace(el){
  const box = document.getElementById("livePace");
  if (!box) return;
  const i = SCRIPT_PHASES.findIndex(q => el >= q.t && el < q.e);
  if (i < 0) { box.textContent = ""; return; }
  const p = SCRIPT_PHASES[i], n = SCRIPT_PHASES[i+1];
  box.innerHTML = `<span class="muted">Pace guide:</span> ${esc(p.label)}${n ? ` <span class="muted">· next at ${clockLeft(n.t)} left</span>` : ""}`;
}

/* ---------- Pace check after a scored mock ---------- */
const PACE_TARGETS = [
  { k:"p2",  label:"Problem 2 on the table", by:300 },
  { k:"ctx", label:"Context reflected back",  by:480 },
  { k:"m1",  label:"Management of problem 1 started", by:480 },
  { k:"m2",  label:"Management of problem 2 started", by:645 }
];
const parseClock = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim()); return m ? (+m[1])*60 + (+m[2]) : null; };
function paceResultHTML(att){
  const pace = att.result?.pace;
  if (!pace) return "";
  return `<h2>Pace</h2>
    <table class="splits"><thead><tr><th>Milestone</th><th>Target</th><th>You</th><th></th></tr></thead><tbody>
    ${PACE_TARGETS.map(t => {
      const s = parseClock(pace[t.k]);
      const st = s == null ? `<span class="late">not done</span>` : s <= t.by + 30 ? `<span class="ok">on time</span>` : `<span class="late">${fmt(s - t.by)} late</span>`;
      return `<tr><td>${esc(t.label)}</td><td>by ${clockIn(t.by)} <span class="muted">(${clockLeft(t.by)} left)</span></td><td>${s == null ? "–" : clockIn(s)}</td><td>${st}</td></tr>`;
    }).join("")}
    </tbody></table>
    <p class="muted">The case's timed script shows lines that fit these targets.</p>`;
}
const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const RANK = {"Superior":3,"Certificate":2,"Non-certificate":1};
let currentTab = "review";
const allCases = () => BUILTIN;
const caseById = id => allCases().find(c => c.id === id);

function rerender(){
  if (reh) return;
  if (currentTab === "review") showReviewList();
  if (currentTab === "topics") showTopics();
}

/* Tabs */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  stopRehearse();
  setTab(b.dataset.tab);
}));
function setTab(t){
  currentTab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"));
  rerender();
  window.scrollTo(0,0);
}
function screen(name){ view.dataset.screen = name; }

/* =========================================================
   REVIEWS
   ========================================================= */
function showReviewList(){
  screen("reviews");
  const off = BUILTIN.filter(c => c.kind === "official").sort((a,b) => a.sample - b.sample);
  view.innerHTML = `
    <h1>Official sample cases</h1>
    <p class="lede">Phase-by-phase walkthroughs of all 26 CFPC sample scripts, each with the full marking guide and a timed script you can rehearse against the clock. Opening one reveals the hidden problem, so read a case only after you have tried it yourself.</p>
    <div class="list">
      ${off.map(c => {
        const r = REVIEWS.find(x => x.id === c.id);
        return `<button class="row" data-id="${c.id}">
          <div><div class="who">Sample ${c.sample}: ${esc(c.name)}, ${c.age}${c.sex}</div>
          <div class="what">${r ? r.topics.map(esc).join(" + ") : "Marking-guide outline"}</div></div>
          <span class="go">Read</span>
        </button>`;
      }).join("")}
    </div>`;
  view.querySelectorAll(".row[data-id]").forEach(b => b.onclick = () => showReview(b.dataset.id));
  view.querySelectorAll(".row[data-oid]").forEach(b => b.onclick = () => showOutline(caseById(b.dataset.oid)));
}
function ul(items){ return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`; }
function showReview(id){
  screen("review");
  const r = REVIEWS.find(x => x.id === id);
  const c = caseById(id);
  if (!r) { showOutline(c); return; }
  view.innerHTML = `
    <button class="back">Back to cases</button>
    <h1>${esc(r.name)}, ${r.age}${r.sex}</h1>
    <p>${r.topics.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</p>
    <p class="lede">${esc(r.gist)}</p>
    <div class="quote">“${esc(r.opening)}”</div>
    <div class="review">
      ${r.sections.map(s => `<section><h3>${esc(s.h)}</h3>${ul(s.items)}</section>`).join("")}
      <section><h3>Connecting insight</h3>${ul(r.insight)}</section>
      <section><h3>Traps</h3>${ul(r.traps)}</section>
      ${c ? `<section><h3>Red flags you must ask </h3>${ul(c.redFlags.map(f => f.item))}</section>` : ""}
      <section><h3>Examiner prompts (hearing one means a miss)</h3>${ul(r.prompts)}</section>
    </div>
    ${c ? `<details><summary>Full marking guide</summary><div class="review">${guideHTML(c)}</div></details>` : ""}
    ${c ? `<details class="scriptbox" open><summary>Timed script: what to say, minute by minute</summary>${scriptHTML(c, true)}</details>` : ""}
    ${c ? `<div class="bar"><button class="btn primary" id="rehearse">Rehearse the script with a timer</button></div>` : ""}`;
  view.querySelector(".back").onclick = showReviewList;
  const rh = view.querySelector("#rehearse");
  if (rh) rh.onclick = () => showRehearse(id, () => showReview(id));
  window.scrollTo(0,0);
}
function guideHTML(c){
  const s = c.scheme;
  const areas = list => list.map((a,i) => `<li><strong>${i+1}. ${esc(a[0])}</strong>: ${a.slice(1).map(esc).join("; ")}</li>`).join("");
  return `
      <section><h3>Problem 1: ${esc(c.issue1)}</h3><ul>${areas(s.issue1.areas)}</ul><p class="muted">Illness experience: ${esc(s.issue1.illness)}</p></section>
      <section><h3>Problem 2: ${esc(c.issue2)}</h3><ul>${areas(s.issue2.areas)}</ul><p class="muted">Illness experience: ${esc(s.issue2.illness)}</p></section>
      <section><h3>Social and developmental context</h3><ul>${areas(s.context.areas)}</ul><div class="quote">“${esc(s.context.example)}”</div></section>
      <section><h3>Management: ${esc(c.issue1)}</h3>${ul(s.mgmt1)}</section>
      <section><h3>Management: ${esc(c.issue2)}</h3>${ul(s.mgmt2)}</section>`;
}
function showOutline(c){
  screen("review");
  const s = c.scheme;
  const areas = list => list.map((a,i) => `<li><strong>${i+1}. ${esc(a[0])}</strong>: ${a.slice(1).map(esc).join("; ")}</li>`).join("");
  view.innerHTML = `
    <button class="back">Back to cases</button>
    <h1>${c.sample ? `Sample ${c.sample}: ` : ""}${esc(c.name)}, ${c.age}${c.sex}</h1>
    <p><span class="tag">${esc(c.issue1)}</span><span class="tag">${esc(c.issue2)}</span></p>
    <div class="quote">“${esc(c.opening)}”</div>
    <div class="review">
      <section><h3>Problem 1: ${esc(c.issue1)}</h3><ul>${areas(s.issue1.areas)}</ul><p class="muted">Illness experience: ${esc(s.issue1.illness)}</p></section>
      <section><h3>Problem 2: ${esc(c.issue2)}</h3><ul>${areas(s.issue2.areas)}</ul><p class="muted">Illness experience: ${esc(s.issue2.illness)}</p></section>
      <section><h3>Social and developmental context</h3><ul>${areas(s.context.areas)}</ul><div class="quote">“${esc(s.context.example)}”</div></section>
      <section><h3>Management: ${esc(c.issue1)}</h3>${ul(s.mgmt1)}</section>
      <section><h3>Management: ${esc(c.issue2)}</h3>${ul(s.mgmt2)}</section>
      <section><h3>Red flags you must ask </h3>${ul(c.redFlags.map(f => f.item + " (" + f.why + ")"))}</section>
      <section><h3>Examiner prompts</h3>${ul(["10 min left: “" + c.prompt10 + "”", "7 min left: “" + c.prompt7 + "”"])}</section>
    </div>
    <details class="scriptbox" open><summary>Timed script: what to say, minute by minute</summary>${scriptHTML(c, true)}</details>
    <div class="bar"><button class="btn primary" id="rehearse">Rehearse the script with a timer</button></div>`;
  view.querySelector(".back").onclick = showReviewList;
  view.querySelector("#rehearse").onclick = () => showRehearse(c.id, () => showOutline(c));
  window.scrollTo(0,0);
}
function syncTabs(){ document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === currentTab ? "true" : "false")); }

/* =========================================================
   TOPIC COVERAGE
   ========================================================= */
function showTopics(){
  screen("topics");
  const cases = {};
  BUILTIN.filter(c => c.kind === "official").forEach(c => {
    (c.topics?.i1||[]).concat(c.topics?.i2||[]).forEach(t => { (cases[t] = cases[t] || []).push(c); });
  });
  const ids = Object.keys(TOPIC_BY_ID);
  const covered = ids.filter(id => cases[id]?.length).length;
  view.innerHTML = `
    <h1>Topic coverage</h1>
    <p class="lede">Every topic from the 26 official CFPC sample scripts, plus high-yield topics outside them. Tap a sample number to open that case's walkthrough, marking guide and timed script.</p>
    <p class="muted">${covered} of ${ids.length} topics appear in a sample case. The rest are high-yield topics to prepare using the approach from the samples.</p>
    ${TOPICS.map(g => `
      <h2>${esc(g.g)}</h2>
      <div class="topics">
        ${g.items.map(([id,label,src]) => {
          const cs = (cases[id]||[]).sort((a,b) => a.sample - b.sample);
          const act = cs.length ? cs.map(c => `<button class="btn small" data-case="${c.id}">Sample ${c.sample}</button>`).join(" ") : `<span class="muted">No sample case</span>`;
          return `<div class="trow"><div><div class="tl">${esc(label)}</div><div class="ts">${esc(src)}</div></div><div class="tst">${act}</div></div>`;
        }).join("")}
      </div>`).join("")}`;
  view.querySelectorAll("[data-case]").forEach(b => b.onclick = () => { currentTab = "review"; syncTabs(); showReview(b.dataset.case); });
}

const READ_S = 60, ENC_S = 900;
const prefs = {};

/* Start */
setTab("review");

</script>
