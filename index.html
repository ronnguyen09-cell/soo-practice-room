<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOO practice room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#152033; --muted:#596579; --line:#D3DAE3;
  --station:#24508F; --station-ink:#FFFFFF; --segment:#F2C230; --segment-ink:#231C04;
  --good:#2C7552; --warn:#A8601F; --bad:#A3392D; --chip:#E2E8F1;
  --pt:#FFF5D9; --cd:#E1EAF7; --focus:#F2C230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141D; --surface:#17202C; --ink:#E6EBF2; --muted:#9BA7B8; --line:#2A3546;
    --station:#3A6DBC; --segment:#E3B520; --chip:#223044; --pt:#2C2717; --cd:#1C2B42;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#17202C; --ink:#E6EBF2; --muted:#9BA7B8; --line:#2A3546;
  --station:#3A6DBC; --segment:#E3B520; --chip:#223044; --pt:#2C2717; --cd:#1C2B42;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-bottom:0;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.brand{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--station);box-shadow:6px 0 0 var(--segment)}
.brand small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:8px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--station);font-weight:700}
h1{font-size:1.6rem;line-height:1.2;margin:24px 0 6px}
h2{font-size:1.2rem;margin:28px 0 8px}
h3{font-size:1.02rem;margin:18px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.lede{color:var(--muted);max-width:62ch}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--station);padding:14px 16px;cursor:pointer;text-align:left;width:100%;border-radius:4px}
.row.mock{border-left-color:var(--segment)}
.row .who{font-weight:700}
.row .what{color:var(--muted);font-size:.92rem}
.row .go{margin-left:auto;color:var(--muted);font-size:.9rem;white-space:nowrap}
.tag{display:inline-block;background:var(--chip);border-radius:3px;padding:1px 7px;font-size:.8rem;margin-right:4px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:6px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--station);border-color:var(--station);color:var(--station-ink);font-weight:700}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{background:none;border:0;color:var(--station);padding:12px 0 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:14px}
.review ul{margin:4px 0 0;padding-left:20px}
.review li{margin:3px 0}
.review section{border-top:1px solid var(--line);padding-top:4px;margin-top:14px}
.quote{border-left:4px solid var(--segment);padding:6px 12px;background:var(--surface);font-style:italic;margin:10px 0}
.notice{border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:6px;margin-top:12px;font-size:.95rem}
.notice.warn{border-color:var(--warn)}
.toggles{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.toggles label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.toggles input{width:20px;height:20px;margin-top:3px;accent-color:var(--station)}

/* Exam clocks, modelled on the CFPC virtual SOO screen */
.clocks{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;margin-top:14px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.clock{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px}
.clock.station{background:var(--station);color:var(--station-ink)}
.clock.segment{background:var(--segment);color:var(--segment-ink)}
.clock .lab{font-size:.9rem}
.clock .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.clock.segment .t{font-size:1.9rem;line-height:1.1}
.clock.segment.low{animation:none}

.door{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 18px;margin-top:14px}
.door .stmt{font-size:1.25rem;line-height:1.4}

.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-bottom:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.p{align-self:flex-start;background:var(--pt);border-bottom-left-radius:4px}
.msg.c{align-self:flex-end;background:var(--cd);border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:.9rem;text-align:center}
.msg .who{display:block;font-size:.75rem;color:var(--muted);margin-bottom:2px}
.msg .flag{display:inline-block;font-size:.72rem;background:var(--bad);color:#fff;border-radius:3px;padding:0 6px;margin-left:6px}
.typing{opacity:.7;font-style:italic}

.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:160px;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px}
.mic{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.mic[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.mic svg{width:22px;height:22px}
.sendb{flex:none;min-height:48px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.levels{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.comp .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.comp .nm{font-weight:700}
.lvl{font-weight:700;font-size:.9rem;padding:2px 8px;border-radius:4px;color:#fff}
.lvl.Superior{background:var(--good)}
.lvl.Certificate{background:var(--station)}
.lvl.Non-certificate{background:var(--bad)}
.comp ul{margin:6px 0 0;padding-left:20px;font-size:.95rem}
.comp .k{font-size:.85rem;color:var(--muted);margin-top:8px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--station)}
.empty{padding:28px 0;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
@media (max-width:520px){
  h1{font-size:1.4rem}
  .clocks{top:calc(env(safe-area-inset-top,0px) + 88px)}
}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;flex:none}
.progress{height:10px;background:var(--chip);border-radius:5px;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;background:var(--station)}
.topics{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow > div:first-child{flex:1;min-width:0}
.tl{font-weight:700}
.ts{font-size:.85rem;color:var(--muted)}
.tst{font-size:.85rem;white-space:nowrap}
.tst .lvl{font-size:.75rem}
.verdict{border-radius:6px;padding:12px 14px;margin-top:12px;border:1px solid}
.verdict.fail{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 10%, var(--surface))}
.verdict.pass{border-color:var(--good);background:color-mix(in srgb, var(--good) 10%, var(--surface))}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--good);border-radius:4px;padding:10px 12px}
.chk.no{border-left-color:var(--bad)}
.chk .ic{font-weight:700;width:1.2em;flex:none}
.chk.ok .ic{color:var(--good)} .chk.no .ic{color:var(--bad)}
.chk .ev{font-size:.85rem;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.h{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:.92rem}
.h .ic{font-weight:700;width:1em;flex:none}
.h.asked .ic{color:var(--good)} .h.partial .ic{color:var(--warn)} .h.missed .ic{color:var(--bad)} .h.n\/a{opacity:.6}
.bad{color:var(--bad);font-weight:700}
@media (max-width:520px){ .trow{flex-wrap:wrap} .tst{order:3;width:100%} }
/* timed scripts */
.k-open{--k:var(--muted)} .k-bg{--k:#8A96A8} .k-p1{--k:var(--station)} .k-p2{--k:#7A4FB0}
.k-ctx{--k:var(--segment)} .k-m1{--k:var(--good)} .k-m2{--k:#2A8A8A}
.tline{position:relative;display:flex;gap:2px;height:14px;margin:18px 0 26px}
.tline .seg{background:var(--k);opacity:.45;border-radius:2px}
.tline .seg.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.tline .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.tline .mark b{position:absolute;top:22px;left:-18px;font-size:.72rem;color:var(--bad);white-space:nowrap;font-weight:600}
ol.script{list-style:none;padding:0;margin:0}
ol.script .ph{border-left:4px solid var(--k);background:var(--surface);border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0}
.ph-hd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.ph-t{font-variant-numeric:tabular-nums;font-weight:700}
.ph-n{font-weight:700}
.ph-s{margin-left:auto;font-size:.85rem}
ol.script ul,.script-cur{margin:6px 0 0;padding-left:20px}
ol.script li li,.script-cur li{margin:3px 0}
li.dir{font-style:italic;color:var(--muted);list-style:none;margin-left:-20px}
.script-cur li{font-size:1.08rem}
.scriptbox>summary{font-weight:700}
.pace-now{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.95rem;min-height:1.5em}
.pace-now .late,.splits .late{color:var(--bad);font-weight:600}
.pace-now .ok,.splits .ok{color:var(--good);font-weight:600}
table.splits{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
.splits th,.splits td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.splits td:nth-child(2),.splits td:nth-child(3){font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.ph-s{margin-left:0;width:100%}.tline .mark b{font-size:.65rem;left:-14px}}
.vmode{border:0;padding:0;margin:0 0 4px;display:flex;flex-direction:column;gap:10px}
.vmode legend{font-weight:700;margin-bottom:6px;padding:0}
.toggles label.slider{flex-wrap:wrap}
.toggles label.slider input[type=range]{width:100%;height:28px;margin:0 0 0 30px;max-width:320px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dot" aria-hidden="true"></span>SOO practice room<small>CFPC oral exam prep</small></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="review" aria-selected="true">Case reviews</button>
      <button role="tab" data-tab="topics" aria-selected="false">Topic coverage</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<script>
/* =========================================================
   TOPICS: every topic from the 26 official CFPC sample scripts,
   plus high-yield topics outside the samples.
   ========================================================= */
const TOPICS = [
 {g:"Chronic disease", items:[
  ["htn","Hypertension","Samples 1, 9, 18"],["dm","Diabetes","Sample 13"],["copd","COPD","Sample 12"],
  ["ra","Rheumatoid arthritis flare","Sample 1"],["postmi","Post-myocardial infarction management","Sample 3"],
  ["uc","Ulcerative colitis","Sample 22"],["polyarth","Polyarthritis secondary to ulcerative colitis","Sample 23"],
  ["thyroidmass","Thyroid mass","Sample 26"],["thyroiditis","Thyroiditis","Sample 6"]]},
 {g:"Mental health", items:[
  ["deppostmi","Depression after a cardiac event","Sample 3"],["ppd","Postpartum depression","Sample 17"],
  ["anxiety","Anxiety or panic attacks","Sample 22"],["ptsd","Post-traumatic stress disorder","Samples 19, 27"],
  ["grief","Grief","Sample 13"],["bdd","Body dysmorphic disorder","Sample 7"],
  ["psychosis","Undiagnosed psychosis (paranoid schizophrenia)","Sample 11"],["adhd","Adult ADHD and stimulant misuse","Sample 20"],
  ["burnout","Workplace burnout","Not in samples"],["eating","Eating concerns","Not in samples"]]},
 {g:"Substance use and addiction", items:[
  ["gambling","Gambling addiction","Sample 4"],["smoking","Smoking cessation","Sample 16"],
  ["alcohol","Alcohol use disorder","Not in samples"],["opioids","Chronic pain and opioid requests","Not in samples"]]},
 {g:"Safety and abuse", items:[
  ["sexassault","Sexual assault","Sample 8"],["elderabuse","Elder financial abuse","Sample 12"],
  ["ipv","Intimate partner violence","Not in samples"]]},
 {g:"Family and caregiving", items:[
  ["caregiver","Caregiver burnout","Sample 10"],["parentsdementia","Parents with dementia","Sample 5"],
  ["dyingparent","Responsibility for a dying parent","Sample 25"],["parenting","Parenting conflict with partner","Sample 26"],
  ["childbehav","Child with atypical behaviours","Sample 23"],["childheadache","Parent worried about child's headaches","Sample 19"],
  ["adolescent","Adolescent visit and confidentiality","Not in samples"]]},
 {g:"Reproductive and sexual health", items:[
  ["pcos","PCOS and fertility","Sample 2"],["nvp","Nausea in pregnancy","Sample 25"],["pregnancy","Pregnancy (with a psychosocial issue)","Sample 27"],
  ["breastmass","Breast mass","Sample 17"],["sti","STI concerns","Sample 21"],["warts","Anogenital warts","Sample 8"],
  ["psa","Abnormal PSA and sperm banking","Sample 5"],["prostatitis","Chronic prostatitis","Sample 18"],
  ["contraception","Contraception and emergency contraception","Not in samples"]]},
 {g:"Neurology and cognition", items:[
  ["cluster","Cluster headaches","Sample 11"],["headache","Headaches","Sample 10"],
  ["concussion","Post-concussion syndrome","Samples 6, 24"],["memory","Memory loss","Sample 16"],
  ["driving","Cognitive decline and driving safety","Not in samples"]]},
 {g:"GI, infectious disease and travel", items:[
  ["gerd","GERD","Sample 4"],["rectalbleed","Rectal bleeding","Sample 24"],["fissure","Anal fissure","Sample 14"],
  ["hepatitis","New hepatitis diagnosis","Sample 14"],["malaria","Malaria","Sample 21"],["sinusitis","Recurrent sinusitis","Sample 2"]]},
 {g:"Musculoskeletal, skin and other", items:[
  ["plantar","Plantar fasciitis","Sample 9"],["mskpain","Musculoskeletal pain","Sample 20"],
  ["hyperhidrosis","Hyperhidrosis","Sample 7"],["oa","Knee osteoarthritis","Not in samples"],["backpain","Low back pain","Not in samples"]]}
];
const TOPIC_BY_ID = {}; TOPICS.forEach(g => g.items.forEach(([id,label,src]) => TOPIC_BY_ID[id] = {id,label,src,group:g.g}));

/* History headings, taken from the CFPC case-description template */
const HISTORY_ITEMS = [
 "Presenting problem in detail","Past medical history","Surgical history and hospitalizations",
 "Medications (including over-the-counter and herbal)","Allergies","Immunizations","Family history",
 "Tobacco","Alcohol","Cannabis and other substances","Caffeine, diet and exercise",
 "Relationships and children","Education, work and finances","Social supports",
 "Sexual and reproductive history (where relevant)","Religion or spirituality (where relevant)"
];

/* =========================================================
   REVIEWS (official samples, summarised in my own words)
   ========================================================= */
const REVIEWS = [
{
  id:"ann-brown", sample:1, name:"Ann Brown", age:56, sex:"F",
  topics:["Rheumatoid arthritis flare","Hypertension"],
  opening:"I am afraid my arthritis is flaring up.",
  gist:"Two biomedical problems, neither hidden. The traps are elsewhere.",
  sections:[
    {h:"0–2 min: open and set the agenda", items:[
      "Visibly in pain: loose clothing, rubbing her wrists. Acknowledge it early.",
      "\"Anything else today?\" brings out the hypertension and the prescription renewal, which avoids the 10-minute prompt."]},
    {h:"2–4 min: social snapshot", items:[
      "Self-employed dog groomer and collie breeder; the business is now her only income.",
      "Husband left 2 months ago, separation not finalised; lives alone on her parents' farm.",
      "76-year-old mother (herself ill) is running the business.",
      "No disability insurance: a superior-level bullet. Ask how she is managing financially."]},
    {h:"4–8 min: rheumatoid arthritis flare", items:[
      "Pain in hands, wrists and shoulders; morning stiffness; worse over 2 months; 2 kg weight loss; fatigue.",
      "Diagnosed 10 years ago; third flare; no family history; rheumatologist 5 years ago.",
      "Acetaminophen ineffective; codeine caused constipation; ibuprofen 400 mg three times a day not helping; methotrexate caused pneumonitis (admitted).",
      "No extra-articular features: eyes, rash, nodules, fever.",
      "Illness experience: embarrassed she waited; can't hold grooming tools, open jars or walk her dog; wants pain control and to get back to work."]},
    {h:"8–10 min: hypertension", items:[
      "Diagnosed 5 years ago; on hydrochlorothiazide-triamterene daily; no physician visit in about a year; home readings around 155/95.",
      "Family history: both parents hypertensive, father MI, mother newly in kidney failure, no stroke.",
      "Former heavy smoker; 2–3 glasses of wine a week; 1 coffee a day; no drugs.",
      "No specific diet; can't exercise; no known diabetes or high cholesterol.",
      "Core fear: ending up on dialysis like her mother."]},
    {h:"About 10 min: context integration", items:[
      "One statement tying it together: her livelihood depends on her hands, the arthritis is taking her independence, her mother's illness has made the blood pressure frightening, and self-employment leaves her financially exposed."]},
    {h:"10–15 min: common ground", items:[
      "Arthritis: arrange a joint exam; erythrocyte sedimentation rate, C-reactive protein, X-rays; discuss analgesia and disease-modifying treatment (methotrexate is out, so refer back to rheumatology); physiotherapy, occupational therapy, splints; assess eye, skin and lung.",
      "Blood pressure: continue treatment; link ibuprofen to the rising readings (she agrees if raised); arrange a complete physical; DASH diet, salt, alcohol, exercise."]}
  ],
  insight:["Ibuprofen ties everything together: it raises her blood pressure, threatens her kidneys (her biggest fear) and isn't helping the pain.",
           "Saying \"I'll arrange an examination\" is a scored management item even though no exam happens."],
  traps:["The marriage is a red herring; she redirects. What's scored is the livelihood and financial impact.",
         "Don't lecture her about neglecting her blood pressure. Validate the wake-up call instead.",
         "Suggesting methotrexate again shows you didn't listen."],
  prompts:["10 min left: she raises her blood pressure if you haven't.","7 min left: she asks what can be done for her arthritis (rarely needed)."]
},
{
  id:"aurora", sample:2, name:"Aurora Enderby-Smith", age:32, sex:"F",
  topics:["PCOS symptoms and fertility","Recurrent sinusitis"],
  opening:"Doctor, I'm 32 years old and I have developed acne.",
  gist:"Nothing hidden and no social crisis. Scoring hinges on handling an antibiotic request and explaining why the pill mattered.",
  sections:[
    {h:"0–2 min: open and agenda", items:[
      "Acknowledge the acne first; she's embarrassed in front of her students.",
      "\"What else is on your mind?\" opens the periods, the pregnancy goal and the sinus infection."]},
    {h:"2–3 min: social snapshot", items:[
      "Grade 9 history teacher for 2 years; married last year; trying to conceive since stopping the pill 7 months ago.",
      "Close to her parents in town, many friends, financially fine, supportive school.",
      "Stakes: new career, pregnancy timeline, can't take time off."]},
    {h:"3–7 min: PCOS symptoms", items:[
      "Acne 5 months (deep, tender, hairline, chest, shoulders); coarse hair on chin, neck and lower abdomen; irregular cycles since stopping the pill.",
      "Teen acne resolved; cycles regular before the pill; no family history of hirsutism.",
      "On the pill for 14 years; stopped 7 months ago.",
      "Negatives: voice, ring or shoe size, galactorrhea, weight change, hypothyroid symptoms.",
      "Illness experience: \"too old for this\", worried about authority in class and about fertility; wants advice and reassurance."]},
    {h:"7–10 min: sinusitis", items:[
      "8 courses of antibiotics in 2 years, not 8 infections.",
      "First episode biphasic with fever and purulent discharge; since then she gets antibiotics within 2–3 days; better within 4 days; yeast infections afterwards.",
      "No allergies, no symptoms between episodes, no trauma, no over-the-counter or herbal remedies.",
      "Today: day 2, pressure, clear discharge, no fever, no face or jaw pain."]},
    {h:"About 10 min: context integration", items:[
      "Start of a career, starting a family; infections threaten work and symptoms may be affecting fertility."]},
    {h:"10–15 min: common ground", items:[
      "PCOS: say it may be PCOS; arrange an exam; options for symptoms and fertility if needed; folic acid at least 0.4 mg daily.",
      "Sinusitis: viral versus bacterial; decongestants, steam, VapoRub; a clear plan if she gets worse; antibiotic resistance."]}

  brief:`You are BILL EVANS, 56. You took early retirement last year and had a heart attack 3 months ago. Your wife Ruby made today's appointment because her own doctor isn't taking patients. You haven't seen a family doctor in at least 5 years.

PROBLEM 1 (you lead with this): AFTER THE HEART ATTACK
- It started as squeezing chest pain walking home with groceries, going to your jaw and left arm, with sweating. You took a taxi to emergency (you know now you should have called an ambulance). They gave you medicine (it caused a headache) and took you straight for a "balloon" and a stent. You don't know which artery or what kind of stent.

- No chest pain since. No breathlessness, but you haven't exerted yourself. No ankle swelling, no extra pillows, no waking breathless. Never went to cardiac rehab; they may have suggested it.
- You were sent home with several pills (you think one for cholesterol, a blood thinner, and one or two for the heart or blood pressure; you don't remember names). You STOPPED ALL OF THEM a month ago because you couldn't be bothered and doubt they do anything. Ruby doesn't know. If asked what you take, say "nothing at the moment".
- If the doctor simply tells you to restart, say "OK" but you won't really mean it unless they explain why the pills matter.
- You smoke half a pack a day: quit after the heart attack, restarted a month ago. You aren't interested in quitting now; listen politely if advised.

- You were always upbeat. Then: your investments lost about half their value soon after you retired; you rely more on Ruby's income than planned; Florida trips look unlikely. Then the heart attack shook you badly. Your family treats you like an invalid; you stopped curling and assume golf is out.

- If asked about mood: "down". If asked if you're depressed: "Maybe. I'm certainly not myself."

- Your daughter Maggie calls almost daily and is visiting in 2 weeks; you don't want her hearing you've "given up". That's partly why you came.

  brief:`You are BILL SNOOK, 42, a brewery worker who supervises a bottling line. Your last family doctor, Dr. Ivany, removed you from his practice a month ago for repeated no-shows.

PROBLEM 1 (you lead with this): HEARTBURN
- For 12 months: intermittent sharp, burning pain behind the breastbone, starting in the upper stomach, sometimes going up into the throat. Comes on suddenly, lasts hours, comes back after a day or so.
- Worse soon after eating (meals are erratic), with fatty food, lying down, and your morning black coffee and chocolate bar. Woken 2 or 3 times at night with burning and a sour acid taste. Dry hacking cough on waking; voice a bit hoarse for 4 months; occasional nausea, no vomiting.
- Tums and a glass of milk help for about 30 minutes.
- No weight loss, no vomiting blood, no change in stool colour or bowels, no trouble swallowing, no fever. Not worse with walking or exercise. No sweating, crushing pain, palpitations, breathlessness, leg swelling, or coughing blood. No recent travel or diet change.
- Your union rep said his father's "heartburn" turned out to be angina. Now you're worried about your heart. You want to be told your heart is OK and get something for the pain. You're open to lifestyle hints.
- Nine months ago Dr. Ivany ordered blood tests and a barium X-ray. You never went and missed three follow-ups without cancelling.

PROBLEM 2 (hidden): GAMBLING
- Five years ago, after moving here, you started playing slot machines on payday with co-workers. For the last 18 months you go every night straight from work, every half day off and most weekends. Slots only, no sports or card betting. You play alone, hate being disturbed, and get "in the zone" for hours, often not eating.
- You spend about $2,000 a month; you earn just under $6,000 before tax. Winning gives you a euphoric "rush" about once a week; after a win or a loss you want "just one more time". If work delays you, you feel restless and agitated. You buy a Lotto ticket weekly and believe your numbers will come up and pay off your debts.
- Consequences: savings ($20,000) gone; moved to a cheap apartment near the casino; defaulted on two $500 bank loans; Visa cancelled 10 months ago; late on rent twice; sold your TV, DVD player and computer; no phone line. Two warning letters at work for lateness and absences.
- Nothing illegal apart from loan defaults. Never borrowed from colleagues or loan sharks. Too embarrassed to ask your mother for money.
- You are NOT depressed. No thoughts of suicide.
- Your daughter Georgina, whom you've never met, wrote 2 months ago asking you to come to her high school graduation in 6 weeks. That's your goal, but you can't afford the trip.
- REVEAL RULES: do NOT reveal the gambling if the candidate fishes early with "anything else?". Bring it up if they ask why your last doctor removed you or why you skipped the tests and appointments, especially if you like them. Otherwise wait for the prompt.
- Feelings: desperate; you know your life is a mess and you want to change, but don't know how or whether a doctor can help.

BACKGROUND
- Medical: nothing of note; you rarely see doctors. Surgery: none.
- Medications: ibuprofen 1-2 tablets a month for aches; Tums recently. Allergies: none. Immunizations: up to date.
- Tobacco: since 16; used to smoke 25 a day, now about 5. Alcohol: one light beer a night at the casino (mainly to save your machine); you do not have a drinking problem. Caffeine: several cups of strong coffee every morning. No cannabis or other drugs.
- Diet: convenience food; a chili-onion hot dog walking home late. Exercise: only the 2 km walk home.
- Family: father Gary, 70, steelworker, was a violent drunk who beat your mother and the boys; he's reportedly been sober and reformed for 15 years. Mother Georgina, 67, born in Quebec; you're close but call rarely. Brother Terry died at 28 in a drunk-driving crash when you were 23. Uncle Tim was told he was "manic-depressive". No heart disease, no bowel problems, no gambling in the family; alcohol and nicotine only.
- Relationships: ex-girlfriend Tracy Crant, 40, a nurse near Pittsburgh, left soon after coming to Canada with you; she was pregnant. No current partner. Past casual relationships and sex workers (always safe sex).
- Children: daughter Georgina, 18, never met; she's close to your parents.
- Education and work: left school at 16 for the steelworks in Pittsburgh; east coast cod fishery until 1992; brewery since age 26; moved here 5 years ago. $39 an hour, unionized, good benefits, untouched pension. Double-pay overtime is available but staying late makes you anxious about missing the casino.
- Supports: none here. Co-workers avoid you. Religion: none.

ACTING
- Unshaven, crumpled work clothes, shy, little eye contact at first. A friendly, non-judgmental candidate quickly gains your trust and you open up and accept advice. A judgmental or closed-question style gets one-word answers.`,

  brief:`You are BRUCE CROTHERS, 56, a self-employed, very successful financial services consultant and national TV business commentator. You like control. Your family doctor, Dr. William Kidd, had a major heart attack last week, so you've come here.

  brief:`You are CHARLES POTVIN, 30, a high school gym teacher and coach. You've never had a family doctor; a friend recommended this practice.

  brief:`You are DANICA WILLIAMS, 27. You've come to this new family doctor for a referral to a plastic surgeon. You also sweat excessively.

  brief:`You are FLORENCE BRUNEAU, 40, a secretary at a shipping company. You moved here a year ago and have no family doctor.

  brief:`You are HELEN PEREIRA, 60. Yesterday the continuing care case manager phoned to say your mother will soon be discharged from rehab. You argued she isn't ready or safe; the manager said "This is the way it is." That started a throbbing headache. Your own family doctor, Dr. Jones, is away for months.

  brief:`You are HENRY BROOKS, 29, an electrical engineer who designs electronic chips. You want a referral to have an electronic chip removed from your head; you believe it causes your headaches.

- You have absolutely no thoughts of harming yourself or anyone else. You have never tried to remove the chip and won't.
- Three and a half years ago your girlfriend Susan said you were jealous and paranoid and made you see a psychiatrist, Dr. Edward Ludwig, who said you were delusional and prescribed olanzapine. It hurt your concentration so you stopped. She left.

- Feelings: anxious and somewhat angry. You think you're under your former boss's influence; it's hurting your work; you're more isolated and enjoy your hobbies less. Doctors have harmed you before, so you don't know what to expect.

  brief:`You are IRENE BOUCHARD, 55, a housekeeper who cleans five or six homes a week. First doctor's appointment in over five years. Speak simply: short phrases, plain words, a bit of slang. Look confused if the doctor uses big medical words.

ACTING
- Simple, inexpensive clothes; no jewellery or makeup.`,

  brief:`You are JEFFREY DALMAZIAN, 42, a civil engineer. You have no family doctor.

  brief:`You are LILLIANNE LAWRENCE, 50, a senior interior decorator. Your family doctor, Dr. Smith, retired.

PROBLEM 2 (raise if asked about anything else): MEMORY
- You always had an excellent memory and kept client details in your head. Over the past year: misplacing keys, glasses, clothes, your Palm Pilot (you blamed the house cleaner and were short with her; she quit 4 months ago). Trouble remembering newer clients' names, though you instantly recognized a junior high friend weeks ago. You can't learn the office's new software despite the classes and sticky notes; each day it feels brand new. Sewing machines and your serger are no problem.

- Feelings: fearful, anxious. Expectation: the doctor will sort this out.

BACKGROUND
- Medical: healthy apart from the cough and bronchitis. A check-up a year ago was all normal (cholesterol, sugar, blood pressure).
- Surgery: appendectomy at 18; Caesarean section with your second child.
- Medications: daily multivitamin with iron, calcium 400 mg, vitamin D 1,000 IU; occasional laxative for constipation.

  brief:`You are SHEENA MURDOCH, 27, a respiratory therapist on the resuscitation team at a tertiary hospital, running all over the hospital daily. You moved here 6 months ago.

 ["I'd like to examine your joints, and check bloodwork (sedimentation rate, C-reactive protein) and X-rays of your hands to see how active this is.","Because of your reaction to methotrexate, you need a different disease-modifying medicine, so I'll refer you back to a rheumatologist.","Until then we can control the pain and inflammation; a short course of a steroid like prednisone is an option to discuss.","An occupational therapist can fit wrist splints and suggest tools so you can keep grooming. Physio helps too.","How does that sound? What would make it hard to do?"],
 ["Let's renew your blood pressure pill today.","The ibuprofen you've been taking can raise blood pressure and strain the kidneys, so cutting it back should help both.","I'd like a full physical, kidney function, urine test, sugar, cholesterol and an electrocardiogram.","Less salt, keeping alcohol low and staying active as your joints allow will all help.","Could you check your pressure at home and bring the readings in 2 to 4 weeks?"],
 ["So: we'll get the arthritis under control with a specialist, cut down the ibuprofen, and watch your blood pressure closely.","Since you can't work right now, we can also look at income support options.","Come back sooner if you get a fever, cough, breathlessness or a hot swollen joint.","What questions do you have? Did I miss anything?"]
];

SCRIPTS["aurora"] = [
 ["Hi Ms. Enderby-Smith, I'm Dr. ___. What brings you in today?","(Let her describe the acne.) That sounds frustrating, especially in front of a classroom."],
 ["Is there anything else you'd like to deal with today, so we make sure we get to it?","(If she mentions a sinus infection: we'll come back to that.)","Tell me a bit about yourself: who's at home, and what do you do?"],
 ["Where is the acne, and when did it start?","Have you noticed any other changes: hair growth on the face or body, or changes to your periods?","When did you stop the pill? What have your cycles been like since?","Any chance you're pregnant right now? When was your last period?","How fast did the hair come on? Any deepening voice, change in body shape, weight gain, breast discharge, or feeling hot or cold?","How long have you been trying to get pregnant, and how often are you having sex?"],
 ["How is this affecting you, at work and at home?","What do you think might be causing it?","What were you hoping I could do today?"],
 ["Any medical conditions or surgeries?","Any medications, including vitamins or folic acid? Allergies?","Do you smoke, drink, or use cannabis or other substances?","Any family history of hormone problems, diabetes or fertility issues?"],
 ["You mentioned a sinus infection. Tell me about it.","How many of these have you had, and how were they treated?","What are your symptoms right now? Fever? Face pain? Is the discharge clear or coloured?","Any eye swelling, vision change, severe headache or stiff neck?"],
 ["What worries you about this one?","What do you usually find helps?","What were you hoping for today?"],
 ["You're early in a teaching career you love and starting a family, and you're facing symptoms that worry you about getting pregnant plus infections that keep you from your students."],
 ["Acne, new hair growth and irregular cycles after stopping the pill can be a hormone pattern called polycystic ovary syndrome.","I'd like to examine you and check blood tests (hormone levels, sugar, cholesterol) and possibly a pelvic ultrasound.","There are good options for the acne and hair that are safe while trying to conceive, and fertility help if it's needed.","Please start folic acid, at least 0.4 mg a day, now.","How does that plan sound?"],
 ["From what you describe, this is most likely a viral sinus infection, which antibiotics won't speed up.","Saline rinses, steam, a decongestant and pain relievers can really help.","Antibiotics also cause your yeast infections and can breed resistance.","If you get a fever, face pain or feel worse after improving, come back; or I can give you a prescription to fill only if that happens. Would that work?"],
 ["So: we'll check your hormones and support you in getting pregnant, and treat this sinus episode without antibiotics for now, with a clear backup plan.","Come back for results in 2 weeks. Seek care urgently for eye swelling, severe headache or a stiff neck.","Anything else on your mind?"]
];

SCRIPTS["bill-evans"] = [
 ["Hi Mr. Evans, I'm Dr. ___. Your wife booked this to check your heart; tell me what's been happening.","(He tells the heart attack story. Note his flat affect.)","That must have been frightening."],
 ["Anything else you'd like to talk about today?","Tell me a bit about yourself: who's at home, and what do you do?","How have things been for you since the heart attack, overall?"],
 ["What did they tell you about your heart in hospital?","Any chest pain, shortness of breath, ankle swelling or palpitations since?","What medications did they send you home on?","What are you actually taking now? (He stopped them all. Stay non-judgmental.)","What made you decide to stop them?","Did they mention cardiac rehab? Do you smoke?"],
 ["What worries you most about your heart?","How has it changed what you can do?","What would you like from me for your heart?"],
 ["Any other medical problems or operations?","Any allergies?","How much alcohol do you drink? Any other substances?","Any heart disease in your family? (Father died at 50 of a heart attack.)"],
 ["You seem a bit down. How has your mood been?","Have you lost interest in things you used to enjoy? How are sleep, appetite, energy?","Sometimes when people feel this low, they think life isn't worth living. Has that crossed your mind?","Have you thought about how you might end your life? Any plan? Any firearms at home?"],
 ["What do you think is behind how you're feeling?","How is it affecting you and Ruby?","What would help you most right now?"],
 ["You'd planned a retirement you'd worked hard for, then lost much of your savings and had a heart attack that's changed how everyone treats you. It makes sense you've been feeling this low."],
 ["Those pills really do protect you: the blood thinner keeps the stent open, the cholesterol pill and the heart pills lower your chance of another heart attack.","Could we restart them? Which ones matter most to you to start with?","I'll get your hospital records, check bloodwork and an electrocardiogram, and refer you to cardiac rehab to get you safely active again, golf included.","When you're ready, I can help with quitting smoking."],
 ["What you're describing sounds like depression, which is very common after a heart attack and very treatable.","Options include counselling, and if needed an antidepressant that's safe for your heart.","If those thoughts get stronger, call me, a crisis line or go to emergency.","I'd also like to check some bloodwork, like your thyroid. Would it help to include Ruby or Maggie?"],
 ["So: restart the heart medications, cardiac rehab, and work on your mood together.","I'd like to see you again in 1 week.","What's your sense of the plan? Anything I missed?"]
];

SCRIPTS["s04-bill-snook"] = [
 ["Hi Mr. Snook, I'm Dr. ___. Tell me about the chest pain.","(Shy, little eye contact. Stay warm and open.)"],
 ["Anything else you'd like to cover today?","Tell me a bit about yourself: work, home?","Who was your doctor before? What happened there?"],
 ["Where is the pain, what's it like, and how long does it last?","What brings it on? Food, lying down, coffee?","Does it come on with walking or exertion? Any sweating, breathlessness, palpitations?","Any trouble swallowing, vomiting, black stools, blood, or weight loss?","Any cough or hoarse voice? What helps?"],
 ["What worries you most about it?","(His union rep's father had angina.) That makes sense.","What were you hoping I could do?"],
 ["Any medical conditions or surgeries?","Medications, including over the counter? Allergies?","How much do you smoke, drink, and how much coffee?","Any heart disease in the family?"],
 ["Your last doctor had ordered some tests. What got in the way of going?","(If he hints at money.) It sounds like things have been tough. Tell me more.","How often do you gamble, and how much do you spend?","What has it cost you: savings, debts, work, relationships?","Have you borrowed money from risky sources or done anything illegal to fund it?","How's your mood? Have you had any thoughts of ending your life?"],
 ["How do you feel about where things are?","What would you like to change?","(His daughter's graduation in 6 weeks.)"],
 ["Going through all this without friends or family nearby must be incredibly stressful. Let's find ways to turn things around so you can get to your daughter's graduation."],
 ["This sounds like acid reflux, not your heart; it's worse after food and lying down, and not with exercise.","I'd like to examine you, and I can do a heart tracing to reassure you.","Small regular meals, less coffee and late-night food, raising the head of the bed, and cutting down smoking all help.","A medication called a proton pump inhibitor will settle it. How does that sound?"],
 ["It sounds like the gambling has become a real problem, and you're ready to change. That's a big step.","There are free addiction counselling programs and Gamblers Anonymous; I can connect you.","What ideas do you have? Some people sign up for casino self-exclusion, or take overtime so there's less free time.","A credit counsellor can help with the debts."],
 ["So: medicine and changes for the heartburn, and support for the gambling.","I'd like to see you back in 2 weeks to check how it's going. Can we book that before you leave?","Go to emergency for chest pain with exertion, sweating or breathlessness. Any questions?"]
];

SCRIPTS["s05-bruce-crothers"] = [
 ["Hi Mr. Crothers, I'm Dr. ___. You've been researching prostate cancer and fertility; tell me what's going on.","(He's knowledgeable and controlling. Engage as a peer.)"],
 ["Anything else on your agenda today?","Tell me a bit about yourself: work, family?","How are your parents doing?"],
 ["What did Dr. Kidd find, and what did he tell you about the PSA?","Any urinary symptoms: frequency, weak stream, getting up at night, blood in the urine?","Any bone pain, weight loss, fever?","Any family history of prostate cancer?","What are your plans with Abigail? Have you two talked about children?"],
 ["How do you feel about having had the PSA done without your consent?","What worries you most?","What were you hoping I'd arrange today?"],
 ["Other medical conditions or surgeries? Medications? Allergies?","Alcohol, tobacco, other substances?"],
 ["You mentioned your father is acting up. Tell me what's happening.","(Rifle patrols.) Is the gun still loaded? Where is the ammunition now?","Who's in the house overnight? Is your mother safe?","Any confusion, paranoia or memory problems lately? Has his doctor seen him?","Who has legal authority for their care and finances?"],
 ["How are you managing all this?","What would you like to happen with your parents?"],
 ["You're caught in the sandwich generation: trying to protect your own health and future family while your parents' needs are reaching a crisis."],
 ["You're right that PSA screening should involve an informed discussion. I'm sorry that didn't happen.","I'd like to repeat the PSA and refer you to a urologist, who may do an ultrasound and biopsy.","Since it's been a while, I'd also like to do a rectal exam myself.","I can refer you to an accredited sperm bank now, so you're prepared. What questions do you have?"],
 ["A loaded rifle with a confused man is an emergency. The gun and ammunition need to be removed from the house today. Can you arrange that?","Someone needs to be there overnight; a night caregiver or a move for your mother.","Your father needs an assessment by Dr. Meldrum soon for possible dementia, and she should know what's happening.","Can you call her today?"],
 ["So: repeat PSA, urology and a sperm bank referral, and the gun removed today with your father assessed.","Let's speak by phone tomorrow about how it went. Anything else?"]
];
SCRIPTS["s06-charles-potvin"] = [
 ["Hi Mr. Potvin, I'm Dr. ___. Tell me about your heart racing.","(He chuckles it off. Gently notice the worry underneath.)"],
 ["Anything else you'd like to cover today?","(If he mentions headaches: let's make sure we get to that.)","Tell me about yourself: work, family?"],
 ["What do you mean by racing? Is it all the time or in episodes? Regular or irregular?","Any chest pain, fainting, shortness of breath?","Any neck pain or swelling, weight loss, feeling hot, bowel changes, tremor?","Any recent illness, like a cold or sore throat in the last month or two?","Caffeine, energy drinks, supplements or stimulants?"],
 ["You said you just wonder what's going on. What's going through your mind?","(Athletes dropping dead.) How is it affecting coaching and home?","What would you like from today?"],
 ["Any medical conditions, medications or allergies?","Alcohol or drugs?","Family history of thyroid or heart problems?"],
 ["Tell me about the headaches.","Any head injuries? (Concussion 5 months ago, knocked out.) How many concussions in total?","Any trouble concentrating, memory, sleep, dizziness?","Any weakness, numbness, vision change, vomiting or balance problems?","Are you still playing hockey or doing contact sport?"],
 ["What worries you about these headaches?","(Permanent damage, dementia.) Who knows about this?","What were you hoping for?"],
 ["Your body is your livelihood and your passion, with a young family depending on you. A racing heart and these headaches strike right at that, especially when you'd hold your students to a stricter rule than you've held yourself."],
 ["The neck tenderness, fast pulse and recent cold suggest an inflamed thyroid, called thyroiditis. It's usually temporary.","I'd like to examine you and check thyroid bloodwork, and do a heart tracing.","A beta-blocker can slow the heart and ease symptoms while it settles.","Hold off on intense exercise until we have results. How does that sound?"],
 ["Your headaches and concentration trouble fit with post-concussion syndrome.","Most people recover, but you need to stop contact sport and strenuous activity until symptoms fully settle, then return step by step.","Another head injury before you're healed could do more harm. Could you coach without playing for now?","Would it help to talk with Danielle about it?"],
 ["So: thyroid tests and something to slow your heart, and a break from contact sport while your brain heals.","Go to emergency for chest pain, fainting, or headache with vomiting or weakness.","I'll see you in 1 to 2 weeks with results. Questions?"]
];

SCRIPTS["s07-danica-williams"] = [
 ["Hi Ms. Williams, I'm Dr. ___. You're hoping for a referral to a plastic surgeon. Tell me more.","(Don't reassure her that she looks fine; don't agree she needs surgery. Listen.)"],
 ["Anything else you'd like to cover today?","Tell me about yourself: who's at home, what do you do?"],
 ["What procedures are you thinking about? Which bothers you most?","How much time a day do you spend thinking about your appearance or checking mirrors?","How has it affected your work, money and relationships?","How is your mood? Any thoughts of harming yourself or that life isn't worth living?","How is your eating? Any dieting, vomiting, or worries about weight?"],
 ["How do you feel when you look in the mirror?","What do you hope surgery would change in your life?","What does your family think?"],
 ["Any medical conditions or surgeries?","Medications and allergies?","Alcohol, smoking, other drugs?"],
 ["Tell me about the sweating.","Where, and since when? Day and night?","Any night sweats, weight loss, fever, palpitations, tremor?","Any medications or supplements? Does anyone else in the family sweat a lot?"],
 ["How has it affected you?","(Library manuscripts, avoiding handshakes, new job next week.)","What were you hoping for?"],
 ["You grew up where success and looks counted for a lot and you've felt overshadowed. The sweating has made work and friendships harder, and surgery may have come to feel like the answer to everything. That must feel lonely."],
 ["I can hear how much distress your appearance is causing you, and that's real.","When appearance worries take up this much time and energy, surgery often doesn't bring the relief people hope for.","Before any surgery, I'd like you to see a counsellor or psychologist who specializes in body image. It's a standard step before surgery.","Would you be open to that? I'll stay involved."],
 ["Excessive sweating like yours is common and treatable.","I'd like to examine you and check thyroid and sugar to rule out other causes.","A strong aluminum chloride antiperspirant at night is the first step.","If that's not enough, options include Botox injections, a water treatment called iontophoresis, or a pill."],
 ["So: counselling to help with the appearance worries, and a treatment plan for the sweating before your new job.","Let's meet again in 2 to 3 weeks.","What questions do you have?"]
];

SCRIPTS["s08-florence-bruneau"] = [
 ["Hi Ms. Bruneau, I'm Dr. ___. Tell me about what you've noticed.","(Nervous, ashamed. Be calm and non-judgmental.)"],
 ["Anything else you'd like to talk about today?","Tell me about yourself: where you live, work, who's around you?"],
 ["When did you notice the bumps, and how have they changed?","Any discharge, itch, pain, sores, fever, pelvic pain or burning with urination?","When was your last Pap test? Ever tested for sexually transmitted infections?","When was the last time you had sex? (\"The last time I'm sure of was two years ago.\") What do you mean by the last time you're sure of?","When was your last period?"],
 ["What worries you most about the warts?","(Cancer, AIDS, syphilis.) How is it affecting you?","What were you hoping for?"],
 ["Any medical conditions, medications or allergies?","Alcohol or drugs?"],
 ["(If she disclosed.) Thank you for telling me. That takes courage.","Can you tell me what happened, at whatever pace feels right?","Are you safe now? Does he know where you live?","How have you been since: sleep, nightmares, fear, mood?","Any thoughts of hurting yourself or ending your life?"],
 ["How are you feeling about it?","(She blames herself.) What happened was not your fault.","What would you like to do about it?"],
 ["What happened would leave anyone frightened, and it came just as you were ready to start socializing again. Now the warts add worry about your health, and you haven't had anyone to talk to."],
 ["Genital warts are caused by HPV, are very common, and often go away on their own. The types that cause warts rarely cause cancer.","Treatment options include freezing, or a cream like imiquimod you can use at home.","I'd like to do a Pap test, and test for other infections: HIV, syphilis, hepatitis, chlamydia and gonorrhea.","Which treatment would suit you?"],
 ["What you describe is a sexual assault. You did not consent, and it is not your fault.","Counselling can really help with the fear and nightmares; I can see you myself, and there are specialized sexual assault services.","Whether to report to police is entirely your choice, now or later. I'll support you either way.","Is there anything that would help you feel safer at home?"],
 ["So: treatment and full testing for the warts, and support for what happened.","I'd like to see you in 1 week for results and to check in.","If you feel unsafe or overwhelmed, call me or a crisis line. Any questions?"]
];

SCRIPTS["s09-gary-mcnicholl"] = [
 ["(Face him, speak clearly, don't cover your mouth.) Hi Mr. McNicholl, I'm Dr. ___. Is there anything I can do to make our conversation easier?","Tell me about your blood pressure."],
 ["Anything else you'd like to cover today?","Tell me about yourself: work, home, family?"],
 ["What readings have you had, and when?","Any chest pain, shortness of breath, headaches or vision changes?","Have you taken cold remedies, decongestants, anti-inflammatories or anything else?","Any heart disease, stroke or kidney disease in the family? (Father MI at 53, brother at 51.)","When was your last check-up and bloodwork?"],
 ["How do you feel about having high blood pressure?","What do you think could be causing it?","What were you hoping for today?"],
 ["Any medical conditions or surgeries? (Meningitis at 3.)","Medications, allergies?","Do you smoke? Alcohol? Diet and exercise?"],
 ["Tell me about your heel.","When is it worst? First steps in the morning?","Any injury, swelling, numbness or other joint pains?","Do you walk barefoot at home? What footwear at work?"],
 ["How is it affecting you?","(Hiking weekend with Donna.) What worries you about the weekend?","What would you like from today?"],
 ["Things are going well with Donna, and this weekend matters. A blood pressure label and a sore heel both threaten how you want to show up for her, healthy and capable."],
 ["Your blood pressure has been high on several visits, so it needs attention.","I'd like home blood pressure readings for a week to confirm it.","I'll do tests: kidney function, sugar, cholesterol, urine and a heart tracing, to look for causes and any effects on the body.","Salt, exercise and weight all help. If it stays high, we'd discuss medication. How does that sound?","(Check he understood.)"],
 ["This sounds like plantar fasciitis, an irritation of the tissue under the heel. It usually settles with time.","Stretch your calf and foot each morning, ice it, wear supportive shoes and avoid going barefoot.","For the weekend: good hiking boots, heel cups, shorter trails, and an anti-inflammatory if needed.","If it's not better, we can try orthotics, a night splint or physio."],
 ["So: home blood pressure readings and tests, and a plan for your heel before the weekend.","Come back in 2 weeks with the readings.","Did that all make sense? Any questions?"]
];
SCRIPTS["s10-helen-pereira"] = [
 ["Hi Ms. Pereira, I'm Dr. ___. You'd like help with your mother; tell me what's happening.","(She wants you to phone the rehab and stop the discharge. Don't promise; listen.)","That sounds like it was sprung on you."],
 ["Is there anything else you'd like to cover for yourself today?","Tell me about your own situation: who's at home, what do you do?"],
 ["What can your mother do on her own right now: walking, toileting, dressing?","Who helps her now, and what happened with home support in the past?","What does a typical week look like for you with her?","How are you coping? Sleep, mood, energy?","Has it ever got to the point you've had thoughts of harming yourself, or her?","Do you have any legal role in her care, like power of attorney?"],
 ["How are you feeling about all this?","(Manipulated, guilty, no holidays in 5 years.) What do you need most right now?","What were you hoping I could do?"],
 ["Your own health: medical conditions, surgeries? (Subdural hemorrhage 12 years ago.)","Medications, how often you take the Tylenol #3? Allergies, anything you avoid?"],
 ["You mentioned a headache since she called. Tell me about it.","Is it like your usual migraines? Anything different from the headache you had with the bleed: sudden onset, vomiting, confusion, weakness?","How often are you getting them now? How many days a month do you take Tylenol #3?","What has worked or not worked for you?"],
 ["How are these headaches affecting you?","What would help you most with them?"],
 ["Being a good daughter has become overwhelming, despite your family and your church. Your mother is asking more than you can give, and it's showing up as more migraines and irritability."],
 ["What you're describing is caregiver burnout. It's not a failing; you've been carrying a lot alone.","With your permission I'll call the rehab team today to share your concerns about her safety and ask for a proper discharge plan and home assessment.","I'd like to see you again to talk about your stress, and counselling can help.","Longer term, let's think about what care your mother needs, and what you can and can't give. How does that sound?"],
 ["This sounds like your usual migraine, but because of your past bleed I'll examine you, and we'll consider imaging if anything changes.","A triptan can stop an attack and avoids anti-inflammatories.","With them coming monthly now, a daily preventive medicine is worth considering.","Watch the codeine, so it doesn't cause rebound headaches."],
 ["So: I'll call the rehab team, we'll support you through your mother's care, and get your migraines better controlled.","Go to emergency for a sudden severe headache, vomiting or confusion.","Come back next week. Anything else?"]
];

SCRIPTS["s11-henry-brooks"] = [
 ["Hi Mr. Brooks, I'm Dr. ___. Tell me about your headaches.","(Watchful, avoids eye contact. Stay calm and curious.)"],
 ["Anything else you'd like to cover today?","Tell me about yourself: work, home?"],
 ["Describe a typical headache: side, quality, how long, how often?","Any watery eye or runny nose on that side? Do they come in bouts?","When did they start? (After a car crash.) Any loss of consciousness then?","Any weakness, numbness, vision or speech change?","What have you tried? Alcohol or smoking?"],
 ["What do you think is causing them?","(The chip.) Tell me more about that.","How are they affecting work and life?"],
 ["Medical conditions, surgeries, medications, allergies?","Alcohol, drugs?","Family history of headaches or mental health conditions?"],
 ["How did the chip get there? Who do you think is behind it?","Do you ever hear things others don't? What do the voices say? Do they tell you to do things?","Have you ever seen a psychiatrist or taken medication for this?","Have you had any thoughts of harming your bosses or anyone else?","Any thoughts of harming yourself? Would you ever try to remove the chip yourself?"],
 ["How are you feeling with all this going on?","(Anxious; distrusts doctors.) What would you like from me?"],
 ["Everything that's happened at work, then the accident, the voices and the headaches, would be a lot for anyone to carry, especially on your own."],
 ["These sound like cluster headaches: one-sided, severe, with eye watering, in bouts.","I'd like to examine you.","For attacks, high-flow oxygen and a triptan nasal spray or injection work well. To prevent a bout, a medication like verapamil helps.","Avoid alcohol during a bout. Does that sound reasonable?"],
 ["I can see how much the voices and the situation with your bosses are troubling you.","I'd like to keep seeing you regularly, and get your records from the psychiatrist.","I'll order bloodwork to check for physical causes.","I'd like you to see a psychiatrist again; would you consider it? I'll be here either way."],
 ["So: treatment for the cluster headaches, bloodwork, and regular visits with me.","If you ever feel like harming yourself or anyone, go to emergency.","Let's meet again in 1 week. Questions?"]
];

SCRIPTS["s12-irene-bouchard"] = [
 ["Hi Ms. Bouchard, I'm Dr. ___. Tell me about your breathing.","(Use plain words. Short sentences.)"],
 ["Anything else you'd like to talk about today?","Tell me about yourself: your work, who's at home?"],
 ["When did the breathing start getting worse? What can you do before you're out of breath?","Any cough or phlegm? Any blood?","Any chest pain, heart racing, swollen ankles, waking up short of breath?","Any weight loss, fevers?","How much do you smoke, and for how long?"],
 ["What do you think is going on?","(Could it be cancer?) How is it affecting work?","What were you hoping for today?"],
 ["Any other health problems? Medications? Allergies?","Alcohol, drugs?","Family history? (Father died of emphysema.)"],
 ["You said money is tight. Tell me more.","(Isabelle.) Who's living with you now?","How have things been with her? Has she ever hurt you or threatened you?","Do you feel safe at home? Any weapons in the apartment?","Has she ever threatened to kill you?"],
 ["How are you feeling about all this?","(Guilt: maybe I was a bad mother.) What would you like to happen?"],
 ["You've worked hard your whole life and your body is your income, so breathing trouble is scary. And now the daughter you never stopped loving is taking your money and frightening you, with nobody to lean on."],
 ["I think the smoking has damaged your lungs. It's called COPD.","I'd like to examine you, get a chest X-ray, and do a breathing test.","Puffers can help you breathe easier at work.","Quitting is the best thing for your lungs. When you're ready, I'll help. What do you think?"],
 ["I'm worried about your safety.","There are people who can help: a social worker, abuse services, and help lines for families with addictions.","If she threatens you, could you leave or call the police?","(She can't imagine calling police.) What could you do? A friend's place? Ms. Lalonde?"],
 ["So: tests and puffers for your breathing, and support for things at home.","Come back in 2 weeks, sooner if you feel unsafe.","Any questions?"]
];

SCRIPTS["s13-jane-webber"] = [
 ["Hi Ms. Webber, I'm Dr. ___. Your children wanted you to see me about how you're feeling. Tell me.","(William died 5 months ago.) I'm so sorry about William."],
 ["Is there anything else you'd like to talk about today, including your own health?","Tell me about yourself: who's at home, what keeps you busy?"],
 ["Tell me about William and what happened.","How have you been since? Sleep, appetite, concentration, energy?","Do you still enjoy things? Your garden?","Any feelings of guilt, hopelessness, or that life isn't worth living?","Any thoughts of ending your life?"],
 ["What do you think about your children's worry?","What's hardest for you right now?","What were you hoping for today?"],
 ["Any medical conditions? (Diabetes, blood pressure, cholesterol.)","What medications do you take? Allergies?","Alcohol or other substances?"],
 ["How's your diabetes been?","What are your sugars running? Any lows: shaky, sweaty, confused, especially with the glyburide?","Any thirst, frequent urination, foot numbness, chest pain, vision changes?","How has eating changed since William died? Exercise?","When was your last eye exam and kidney check?"],
 ["What worries you about your diabetes?","(Brothers with heart attacks.) What would help you get back on track?"],
 ["Losing William after 42 years has left a huge gap, and he was your link to friends and the community. No surprise your children worry, or that your sugars have slipped while you're cooking for one and grieving."],
 ["What you're describing sounds like a normal grief reaction, not depression.","Grief support groups or counselling can help; I'm here too.","Would it help if I met with your children, or I could suggest what to tell them?","I'd like to see you again in a few weeks."],
 ["Your diabetes needs to get back on track.","I'll examine you, check your blood pressure, A1C, kidneys, cholesterol and urine, and arrange an eye exam.","Because your eating is irregular, the glyburide could cause lows; we may adjust it.","A dietitian or a cooking-for-one class could help. Could you get back to your evening walks?"],
 ["So: support for your grief, and getting your diabetes back under control.","If you have low sugars, eat something sweet and call me.","See you in 2 to 3 weeks. Questions?"]
];
SCRIPTS["s14-jeffrey-dalmazian"] = [

 ["What's going through your mind about this?","How has it affected things with Annabella?","What were you hoping for today?"],
 ["Any medical conditions, surgeries?","Medications, allergies?","Alcohol, drugs?"],
 ["You mentioned pain when you go to the toilet. Tell me about it.","When did it start? (After codeine and constipation.)","Any blood? Bright red on the paper or mixed in? Dark stools?","Any weight loss, change in bowel habits before this, or family history of bowel cancer?"],
